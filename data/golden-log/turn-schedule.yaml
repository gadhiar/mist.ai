# Golden log -- authored turn schedule (R1.4.5)
#
# The `log` half of `graph = f(seed@version, log, epoch)`, authored as a repo fixture.
# NEVER written to the live event store: `scripts/golden_log/generate.py` materializes it
# into an isolated EventStore + ExtractionCache that the caller supplies.
#
# Gap-schedule rationale, elapsed-time table, and close-reason coverage: GAP-SCHEDULE.md
# (authored and committed BEFORE any R1.5 staleness-window constant was consulted).
#
# Turn entry shape:
#   id        deterministic; becomes event_id `golden-<id>`. Never generated.
#   at        authored ISO-8601 timestamp. Load-bearing content, not metadata.
#   utterance required only for authored turns; gold turns take theirs from the corpus.
#   record    present => authored inline, in GOLD shape (translated by the same code path
#             as the corpus). Absent => `id` must resolve to a tag in gold_corpus.
#
# session_id is derived as `golden-YYYY-MM` from `at` (pinned by
# tests/unit/golden_log/test_generate.py). Turns are listed in timestamp order, so rowid
# order and timestamp order agree -- the replay reads rowid order.

