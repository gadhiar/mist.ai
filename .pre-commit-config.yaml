# Pre-commit hooks for MIST.AI
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--config=pyproject.toml]

  # Python linting and auto-fixing
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Note: mypy type checking is run in CI only (requires full project dependencies)
  # To run locally: python -m mypy backend/server.py (or any specific file)

  # Security scanning with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(dependencies/|tests/)

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        # No inline --ignore-words-list: pyproject.toml's [tool.codespell] is the
        # single source of truth. The inline copy overrode it and had drifted
        # (pyproject listed 'deriver', the inline args did not).
        additional_dependencies: ["tomli"]
        exclude: ^(dependencies/|\.git/|\.venv/)

  # AI slop detection (runs on the files pre-commit passes it: staged files
  # locally, every tracked file matching the filter below under --all-files)
  - repo: local
    hooks:
      - id: check-ai-slop
        name: Check for AI slop patterns
        entry: python scripts/check_ai_slop.py --critical-only --no-color
        language: system
        pass_filenames: true
        files: \.(py|md|txt|ya?ml|json|dart|sh)$
      - id: no-audio-files
        name: No audio or video (voice data lives in the private root)
        entry: audio is not committed to this repository (it is public); video is not either; keep voice data under MIST_VOICE_PRIVATE_ROOT
        language: fail
        files: (?i)\.(wav|flac|mp3|ogg|opus|m4a|aac|ac3|eac3|dts|aif|aiff|wma|mka|mkv|mp4|m4v|mov|avi|webm|wmv|flv|m2ts|vob)$
      - id: no-voice-assets
        name: No voice identities, voice-data manifests, arrays or model weights
        entry: voice identities and model weights are not committed to this repository (it is public); keep them under MIST_VOICE_PRIVATE_ROOT
        language: fail
        files: (?i)((^|/)(voice|student|target)\.json$|\.(npy|npz|pt|pth|bin|ckpt|onnx|safetensors|nemo|gguf|pkl|h5|hdf5|parquet|arrow)$)
      - id: no-voice-data-records
        name: No private voice-data records, subtitles, alignments or archives
        entry: voice-data records are not committed to this public repository; keep them under MIST_VOICE_PRIVATE_ROOT
        language: fail
        files: (?i)(\.private\.|\.(srt|vtt|ass|rttm|textgrid|lab|tar|tgz|zip|7z)$)
      - id: no-voice-private-terms
        name: No private voice-data terms
        entry: python scripts/check_voice_private_terms.py
        language: system

  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        # tests/unit/model_bench/fixtures/host/llama_server_help_b<build>.txt is a
        # byte-verbatim `llama-server --help` capture, pinned by sha256 and line count
        # in tests/unit/model_bench/test_host_help_flags.py:38-47. Stripping trailing
        # whitespace from it changes those bytes and breaks that pin, so it is excluded
        # alongside the existing markdown exclude (pre-commit takes one `exclude` per
        # hook, so both patterns are combined into a single regex).
        exclude: (\.md$|^tests/unit/model_bench/fixtures/host/llama_server_help_b\d+\.txt$)
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]
        # .gitattributes pins `*.bat text eol=crlf` -- Windows batch files require CRLF,
        # and `eol=crlf` is an explicit checkout instruction that applies on EVERY
        # platform, including the ubuntu-latest CI runner. Without this exclude the two
        # rules directly contradict each other: git checks the .bat files out as CRLF,
        # this hook rewrites them to LF, and the hook exits 1. Verified by execution
        # against an LF checkout -- `scripts/start_frontend.bat` (7 CR bytes) and
        # `scripts/install-git-hooks.bat` (114 CR bytes) were the only two files the
        # full-repo run touched. The blobs are LF; only the checkout is CRLF.
        exclude: \.bat$

# Configuration
default_language_version:
  python: python3.11

# Run hooks in parallel when possible
default_stages: [commit]
fail_fast: false
