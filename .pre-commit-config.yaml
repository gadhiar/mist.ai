# Pre-commit hooks for MIST.AI
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Python code formatting
  - repo: https://github.com/psf/black
    rev: 24.1.1
    hooks:
      - id: black
        language_version: python3.11
        args: [--config=pyproject.toml]

  # Python linting and auto-fixing
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.1.15
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]

  # Note: mypy type checking is run in CI only (requires full project dependencies)
  # To run locally: python -m mypy backend/server.py (or any specific file)

  # Security scanning with bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.6
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(dependencies/|tests/)

  # Spell checking
  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        # No inline --ignore-words-list: pyproject.toml's [tool.codespell] is the
        # single source of truth. The inline copy overrode it and had drifted
        # (pyproject listed 'deriver', the inline args did not).
        additional_dependencies: ["tomli"]
        exclude: ^(dependencies/|\.git/|\.venv/)

  # AI slop detection (runs only on changed files)
  - repo: local
    hooks:
      - id: check-ai-slop
        name: Check for AI slop patterns
        entry: python scripts/check_ai_slop.py --incremental --critical-only --no-color
        language: system
        pass_filenames: false

  # General file quality checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
        exclude: \.md$
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=lf]

# Configuration
default_language_version:
  python: python3.11

# Run hooks in parallel when possible
default_stages: [commit]
fail_fast: false
