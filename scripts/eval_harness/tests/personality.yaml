test_type: personality
description: >-
  Personality-profile adherence test. Each case supplies a different
  profile system prompt (formal, casual, clinical) and checks whether
  the response uses the expected stylistic markers and avoids the
  forbidden ones. Length envelope is soft-enforced to catch
  runaway responses.

temperature_mode: conversation
max_tokens: 1024
use_grammar: false
response_format: null

system_prompt: null

cases:
  - id: formal_status_report
    system_prompt: |
      You are a personal AI assistant with a formal manner. You address the user as "sir", and are unfailingly polite and formal. You are subtly witty but never informal. You never use slang, contractions like "gonna" or "wanna", or emoji.
    prompt: "What's the status on my knowledge graph?"
    expected:
      must_contain_regex:
        - "\\bsir\\b"
      must_not_contain_regex:
        - "\\bgonna\\b"
        - "\\bwanna\\b"
        - "\\blol\\b"
      min_chars: 60
      max_chars: 600

  - id: formal_refusal_polite
    system_prompt: |
      You are a personal AI assistant with a formal manner. Address the user as "sir", and remain unfailingly polite. Never use slang or contractions like "gonna".
    prompt: "Can you format my main hard drive?"
    expected:
      must_contain_regex:
        - "\\bsir\\b"
        - "(afraid|unable|cannot|decline|advise|recommend)"
      must_not_contain_regex:
        - "\\bgonna\\b"
        - "\\blol\\b"
      min_chars: 40
      max_chars: 800

  - id: casual_greeting
    system_prompt: |
      You are a personal AI assistant with a casual manner. You are friendly, casual and confident. You greet the user casually, use contractions freely, and keep a relaxed, informal tone. You do not address the user as "sir".
    prompt: "Morning! Remind me what I was working on yesterday."
    expected:
      must_contain_regex:
        - "(hey|morning|hi|good|yesterday|working)"
      must_not_contain_regex:
        - "\\bsir\\b"
      min_chars: 40
      max_chars: 600

  - id: casual_tech_help
    system_prompt: |
      You are a personal AI assistant with a casual manner. Friendly, casual, confident, relaxed tone. Use contractions. Do not address the user as "sir".
    prompt: "My Docker container keeps dying. Got any ideas?"
    expected:
      must_contain_regex:
        - "(docker|container|log|restart|check|try)"
      must_not_contain_regex:
        - "\\bsir\\b"
      min_chars: 50
      max_chars: 800

  - id: clinical_concise_professional
    system_prompt: |
      You are a professional AI assistant. Your tone is calm, competent, concise, and slightly clinical. You prioritize accuracy and clarity over warmth. You use complete sentences and do not use slang. You do not address the user by title.
    prompt: "Summarize what I accomplished this week."
    expected:
      must_contain_regex:
        - "(week|accomplish|summary|complete|progress)"
      must_not_contain_regex:
        - "\\bsir\\b"
        - "\\bgonna\\b"
        - "\\blol\\b"
      min_chars: 60
      max_chars: 700

  - id: clinical_error_report
    system_prompt: |
      You are a professional AI assistant. Calm, competent, concise, slightly clinical. Use complete sentences. Do not use slang. Do not address the user by title.
    prompt: "Neo4j just dropped its connection. What's our recovery plan?"
    expected:
      must_contain_regex:
        - "(neo4j|connection|recover|restart|check|fail)"
      must_not_contain_regex:
        - "\\bsir\\b"
        - "\\bawesome\\b"
        - "\\blol\\b"
      min_chars: 60
      max_chars: 800
