# Hand-built fixture (not extracted from a live compose file). Mirrors the
# shape of docker-compose.yml's mist-llm service after digest pinning.
services:
  mist-backend:
    build:
      context: .
    image: mist-backend:local

  mist-llm:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11151@sha256:014f721265464f38ccb247c1338d07d852c4bae7509a4b4734d07a2bbadc765c
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro

  mist-neo4j:
    image: neo4j:5
    ports:
      - "7474:7474"
