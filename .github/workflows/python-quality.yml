# CI runs the SAME hooks, at the SAME pinned versions, as the local pre-commit gate.
#
# This file used to install its own linters unpinned:
#
#     pip install black ruff mypy bandit[toml] codespell
#
# while `.pre-commit-config.yaml` pinned black 24.1.1 / ruff v0.1.15 / bandit 1.7.6 /
# codespell v2.2.6. So the two gates enforced DIFFERENT rules, and the CI side changed
# whenever an upstream release shipped -- with nothing in this repository changing. That
# is how pushes started failing on already-committed, locally-clean code: black 24.1.1
# accepts `backend/event_store/store.py` and `backend/vault/sidecar_index.py`; black
# 26.3.1 reformats both under the 2024 stable multiline-string style. Same files, same
# pyproject.toml, different tool version.
#
# Running `pre-commit run --all-files` makes that drift structurally impossible rather
# than something two lists have to be kept in sync on: there is now exactly one place
# where a linter version is declared, and it is the file developers already run against.
# Bumping a hook becomes a deliberate edit to `.pre-commit-config.yaml`, visible in review.
name: Python Code Quality

on:
  push:
    # Every branch. The previous filter was [main, feat/**, dev/**], which silently
    # skipped the gate on the `fix/**` and `chore/**` prefixes this repo also uses --
    # so a branch could be developed and merged having never been checked.
    branches: ['**']
  pull_request:
    branches: [main]

# No `paths:` filter. The gate now covers markdown, YAML, TOML and JSON as well as
# Python (codespell, check-yaml, check-toml, check-json, the AI-slop check), so
# restricting it to Python paths would let those hooks pass by never running.

jobs:
  quality:
    name: pre-commit (all files)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install pre-commit
        run: python -m pip install --upgrade pip pre-commit

      # Hook environments are expensive to build and change only when the config
      # does, so key the cache on the config hash.
      - name: Cache pre-commit environments
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-py3.11-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run all hooks
        run: pre-commit run --all-files --show-diff-on-failure

  # Blocking unit-test gate (MIS-172). CPU-only: no GPU, no Neo4j -- the unit tier
  # itself enforces that via tests/unit/conftest.py's live-write guard, and the
  # vault-backed tests skip (tests/unit/conftest.py's pytest_collection_modifyitems)
  # because mist-memory/ is a private, gitignored directory that does not exist here.
  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      # The install steps below mirror docker/backend/Dockerfile step for step, in
      # the same order, because the image -- not requirements.txt alone -- is what
      # the suite runs against: the image gets fastapi and uvicorn only
      # transitively (through chatterbox-tts), so a requirements-only install
      # fails collection with ModuleNotFoundError. The deliberate differences are
      # CPU wheels instead of CUDA 12.4 ones, and no flash-attn (CUDA-only and
      # optional in the image too, Dockerfile:87-90).

      # Dockerfile:8-11, minus the interpreter packages setup-python provides.
      # `sounddevice` loads libportaudio at import, and src/multimodal/stt.py
      # imports it at module level; unit tests reach that import through
      # backend/voice_processor.py -> backend/voice_models/model_manager.py, so
      # without the library collection fails with "OSError: PortAudio library not
      # found".
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsndfile1 libportaudio2 ffmpeg

      # Dockerfile step 1 (lines 39-41), from the CPU index.
      - name: Install PyTorch (CPU)
        run: |
          pip install torch==2.6.0 torchaudio==2.6.0 torchvision==0.21.0 \
            --index-url https://download.pytorch.org/whl/cpu

      # Dockerfile step 2 (line 44).
      - name: Install Chatterbox TTS
        run: pip install chatterbox-tts soundfile

      # Dockerfile step 3 (line 48) plus its safety net (line 51). requirements.txt
      # pins torch==2.4.0, which the image re-pins at step 4; installing that line
      # here would replace the CPU wheels with PyPI's multi-GB CUDA build, so the
      # three torch lines are filtered out and step 4 below re-checks the pin.
      - name: Install backend requirements (torch lines filtered)
        run: |
          grep -vE '^(torch|torchaudio|torchvision)==' requirements.txt > "$RUNNER_TEMP/requirements-cpu.txt"
          pip install -r "$RUNNER_TEMP/requirements-cpu.txt"
          pip install "openai>=1.30" "httpx>=0.27"

      # Dockerfile step 4 (lines 53-61): re-pin PyTorch only if an earlier step
      # replaced it, here against the CPU build.
      - name: Re-pin PyTorch (CPU) if overwritten
        run: |
          TORCH_VER=$(python -c "import torch; print(torch.__version__)")
          if [ "$TORCH_VER" != "2.6.0+cpu" ]; then
            echo "PyTorch was overwritten to $TORCH_VER -- re-pinning to 2.6.0+cpu"
            pip install --force-reinstall torch==2.6.0 torchaudio==2.6.0 torchvision==0.21.0 \
              --index-url https://download.pytorch.org/whl/cpu
          else
            echo "PyTorch 2.6.0+cpu intact -- skipping re-pin"
          fi

      # Pins the test runner to the versions the backend image actually runs:
      # pytest 7.4.4 and pytest-asyncio 0.23.8 (`pip list` in the image). The
      # image's step 6 (Dockerfile:93) reads `pip install pytest>=8.0
      # pytest-asyncio>=0.24` unquoted, so the shell treats each `>=` as an output
      # redirect and the requirements.txt versions stay. requirements.txt alone
      # would pin pytest but float pytest-asyncio (>=0.23.0) to its latest
      # release, so both are pinned here to keep CI on the combination the
      # suite is verified against.
      - name: Install test dependencies
        run: pip install "pytest==7.4.4" "pytest-asyncio==0.23.8"

      - name: Run unit tests
        run: python -m pytest tests/unit -q -p no:cacheprovider

  # mypy is NOT a pre-commit hook and is advisory only, exactly as it was before this
  # file was rewritten. It is kept as its own non-blocking job so its findings stay
  # visible without gating a merge -- dropping it would have silently narrowed coverage.
  types:
    name: mypy (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install mypy
        run: python -m pip install --upgrade pip mypy

      - name: Type check
        run: mypy backend/ --follow-imports=silent || echo "Type checking found issues (non-blocking)"
