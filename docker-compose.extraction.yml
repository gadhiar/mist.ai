# MIST.AI extraction service -- LOCAL overlay compose file (T1b, goal
# mist-two-loop / MIS-171).
#
# Deploys the stateless extraction service (backend/extraction_service/)
# plus its own dedicated llama-server, for the LOCAL deployment only (RTX
# 4070 SUPER, beside the main stack). This file is an OVERLAY: it is always
# invoked alongside docker-compose.yml, never alone, so the extraction-local
# services join the main stack's default network and can be reached at the
# stable name `mist-extraction` -- backend/factories.py wiring (T2, not this
# task) points there.
#
#   Local  (RTX 4070 SUPER, 12 GB, alongside the main stack):
#     docker compose -f docker-compose.yml -f docker-compose.extraction.yml \
#       --profile extraction-local up -d
#
# The GTX 1070 host deployment does NOT use this file. It is a separate
# machine reached over Tailscale that never runs docker-compose.yml's main
# stack (mist-llm, mist-neo4j, mist-backend) -- running the whole stack there
# was the defect this split fixes (MIS-171 compose-split). Its three
# services (llama-server, extraction service, Tailscale sidecar) live in the
# standalone file docker/extraction/compose.host.yml instead:
#
#   Host (GTX 1070, 8 GB, Pascal, reached over Tailscale, standalone --
#   this file's services only, no docker-compose.yml involved):
#     docker compose -f docker/extraction/compose.host.yml up -d
#
# The `extraction-local` profile stays on both services here even though
# this file now holds only one profile: it is the documented manual on/off
# switch for running extraction beside the main stack (README.md, "switched
# on manually"). Dropping it would make `docker compose -f docker-compose.yml
# -f docker-compose.extraction.yml up` start extraction every time the main
# stack starts, which is not the deploy this file documents.
#
# See docker/extraction/README.md for every EXTRACTION_* / LLAMA_ARG_*
# env var and the -ncmoe sizing evidence for this profile.
#
# The llama.cpp image is the SAME digest as mist-llm in docker-compose.yml
# (goal mist-model-bench pin, b11151/cuda12) and the same digest used by
# docker/extraction/compose.host.yml -- one pinned build across the whole
# deployment, not a second moving tag. tests/unit/test_compose_extraction.py
# asserts the llama-server service below uses this exact string.
services:
  mist-extraction-llm-local:
    profiles: ["extraction-local"]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda-b11151@sha256:014f721265464f38ccb247c1338d07d852c4bae7509a4b4734d07a2bbadc765c
    container_name: mist-extraction-llm-local
    # No `ports`: reachable only from mist-extraction-local on the compose
    # network. Debugging goes through the extraction service's own optional
    # 127.0.0.1 port below, not this one.
    volumes:
      - ${MODELS_DIR:-./models}:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/${EXTRACTION_MODEL_FILE:-ggml-org/gpt-oss-20b-MXFP4.gguf}
      - LLAMA_ARG_N_GPU_LAYERS=999
      # 16384, not 8192: a real /v1/extract probe (one-sentence utterance,
      # empty history) needed 9162 prompt tokens, and the extraction engine
      # (backend/extraction_service/engine.py) asks for max_tokens=2048 on
      # top -- 9162 + 2048 > 8192, so extraction could not succeed at the
      # old default. See docker/extraction/README.md's ctx-size subsection.
      - LLAMA_ARG_CTX_SIZE=${EXTRACTION_LLM_CTX_SIZE:-16384}
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_N_PARALLEL=1
      - LLAMA_ARG_METRICS=1
      # jinja on (llama_server_help_b11151.txt:626, default already enabled;
      # set explicitly, same as mist-llm, rather than relying on the default).
      - LLAMA_ARG_JINJA=1
      # Force reasoning on rather than relying on `-rea auto`'s "detect from
      # template" (README.md:594-596's citable reason for c9's own `-rea on`;
      # gpt-oss's Harmony reasoning is always-on per the T0 brief, this just
      # avoids depending on auto-detection this worker cannot verify live).
      - LLAMA_ARG_REASONING=on
      # deepseek format puts thoughts in `message.reasoning_content`
      # (llama_server_help_b11151.txt:631) -- the exact field
      # backend/llm/llama_server_provider.py:207/218 reads via getattr.
      - LLAMA_ARG_THINK=deepseek
    command:
      - "--no-webui"
      # -ncmoe / --n-cpu-moe N: keep the first N MoE layers' expert weights
      # on CPU (llama_server_help_b11151.txt:124). gpt-oss-20b measured
      # ~10.8 GiB VRAM at ncmoe=6 (T1b brief, not independently re-measured
      # by this worker -- no GPU, no docker) and at that setting cannot sit
      # beside the main stack's Gemma 4 E4B on a 12 GB card. No repo-held
      # measurement exists at any OTHER ncmoe value for this model on this
      # card (searched scripts/model_bench/README.md, arms.json, analyse.py
      # for "10.8"/"gpt-oss" VRAM figures -- none found beyond the ncmoe=6
      # point above). Per the brief's own fallback: default to ALL experts
      # on CPU. gpt-oss-20b's block_count is now VERIFIED as 24 via the GGUF
      # file's own metadata (the host build's finding; b11151's llama-server
      # load log is not confirmed to print this either -- see
      # docker/extraction/HOST_1070_RUNBOOK.md step 5.2/5.3), so 24 replaces
      # the previous saturating sentinel (999) as the precise "all experts
      # on CPU" value -- same qualitative default, now exact instead of a
      # sentinel llama.cpp would otherwise saturate down to anyway.
      # The lead measures the real fitting value on the 4070 alongside the
      # E4B and records it here (clause F,
      # scripts/model_bench/analyse.py:1025 -- arm_peak + voice_vram + margin
      # <= total_mib).
      - "-ncmoe"
      - "${EXTRACTION_LOCAL_NCMOE:-24}"
      # CPU-MoE prompt processing needs larger batch sizes (README.md:559,
      # modeled on c3/c9's arg_overrides).
      - "-b"
      - "2048"
      - "-ub"
      - "2048"
      # -lm none: disable mmap (README.md:290, c3/c9's arg_overrides), paired
      # with CPU-MoE offload.
      - "-lm"
      - "none"
      # No --reasoning-budget: the service sends a per-request budget
      # (backend/extraction_service/settings.py's reasoning_budget_tokens,
      # None by default -> omitted from the outgoing request); omitting the
      # server flag too leaves llama-server's own default in effect, which
      # is ALREADY -1/unrestricted (llama_server_help_b11151.txt:645), so a
      # request-level -1 and "flag absent" resolve to the same unbudgeted
      # behavior. Do not add --reasoning-budget here --
      # test_compose_extraction.py asserts it is absent.
      - "--cache-ram"
      - "${LLM_CACHE_RAM_MIB:-2048}"
      # gptoss family sampling (README.md:562-563, arms.json c9/bench-c9):
      # UNVERIFIED -- OpenAI's stated gpt-oss recommendation as relayed by
      # the T7 brief, not independently re-derived from a primary source
      # (no network in that worker's container either).
      - "--temp"
      - "1.0"
      - "--top-p"
      - "1.0"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  mist-extraction-local:
    profiles: ["extraction-local"]
    build:
      context: .
      dockerfile: docker/extraction/Dockerfile
    container_name: mist-extraction-local
    # Stable DNS name the backend uses regardless of which deployment is
    # active (T1b brief: "keep the service DNS name the backend uses
    # stable (mist-extraction), via hostname or aliases"). The host
    # deployment (docker/extraction/compose.host.yml) is a separate machine
    # reached over Tailscale, not by this compose DNS name, so there is no
    # collision between the two.
    hostname: mist-extraction
    # Optional debug port, loopback-only -- nothing else is published.
    # Comment out (or leave EXTRACTION_DEBUG_PORT unset and this line
    # present, which still forwards -- remove the line entirely to fully
    # disable) if not debugging locally.
    ports:
      - "127.0.0.1:${EXTRACTION_DEBUG_PORT:-8090}:8090"
    environment:
      - EXTRACTION_LLM_BASE_URL=http://mist-extraction-llm-local:8080
      # Required, no default -- defines the epoch. A missing value fails
      # `docker compose config` rather than silently deploying an
      # unstamped model. See docker/extraction/README.md.
      - "EXTRACTION_MODEL_HASH=${EXTRACTION_MODEL_HASH:?EXTRACTION_MODEL_HASH is required, no default -- it stamps every extraction result's epoch. Set it to the deployed model file + adapter identity, e.g. gpt-oss-20b-mxfp4-gptoss-v1.}"
      - EXTRACTION_MODEL_FILE=${EXTRACTION_MODEL_FILE:-ggml-org/gpt-oss-20b-MXFP4.gguf}
      - EXTRACTION_ADAPTER=${EXTRACTION_ADAPTER:-gptoss}
      - EXTRACTION_REASONING_EFFORT=${EXTRACTION_REASONING_EFFORT:-low}
      - EXTRACTION_LOCATION_LABEL=local-4070
      - LLAMA_CPP_BUILD=b11151
      # EXTRACTION_LLM_TIMEOUT_SECONDS / EXTRACTION_MAX_ATTEMPTS /
      # EXTRACTION_CONSTRAINED_MODE were previously silently unreachable
      # inside this container: compose never forwarded them, even though
      # docker/extraction/README.md documented them as operator-settable.
      # ServiceSettings.from_env() (backend/extraction_service/settings.py)
      # reads each straight from the process environment, but an
      # `environment:` list that omits a key leaves that key unset inside
      # the container regardless of what the host shell has -- so all three
      # silently fell back to the dataclass defaults no matter what an
      # operator set on the host.
      #
      # EXTRACTION_LLM_TIMEOUT_SECONDS: ServiceSettings.llm_timeout_seconds
      # defaults to 30.0s, but the ctx-16384 re-fit measured a real cold
      # /v1/extract call at 51.3-51.8s across the ncmoe sweep (see
      # docker/extraction/README.md's "Host ncmoe sizing" table) -- 30s
      # fails outright on this hardware. 120 gives real headroom above the
      # measured figure.
      - EXTRACTION_LLM_TIMEOUT_SECONDS=${EXTRACTION_LLM_TIMEOUT_SECONDS:-120}
      # EXTRACTION_MAX_ATTEMPTS: matches ServiceSettings.max_attempts' own
      # default (2 -- the first call plus one repair retry on unparsable
      # output).
      - EXTRACTION_MAX_ATTEMPTS=${EXTRACTION_MAX_ATTEMPTS:-2}
      # EXTRACTION_CONSTRAINED_MODE: default is an EMPTY string, not a mode
      # name. engine.py's _resolve_constrained_mode reads
      # `self._settings.constrained_mode or self._adapter.default_constrained_mode`
      # -- a Python `or`, so an empty string is falsy and falls through to
      # the adapter's own default, exactly like the unset/None case before
      # this var was reachable. This makes the setting overridable without
      # changing today's effective default.
      - EXTRACTION_CONSTRAINED_MODE=${EXTRACTION_CONSTRAINED_MODE:-}
    depends_on:
      mist-extraction-llm-local:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8090/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
